name: Build and publish recipe website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: recipe-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recipes
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore tests/RecipeSiteBuilder.Tests/RecipeSiteBuilder.Tests.csproj --locked-mode
      - name: Test recipe builder
        run: dotnet test tests/RecipeSiteBuilder.Tests/RecipeSiteBuilder.Tests.csproj --configuration Release --no-restore
      - name: Generate website
        run: dotnet run --project tools/RecipeSiteBuilder --configuration Release --no-restore -- .
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload generated website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
