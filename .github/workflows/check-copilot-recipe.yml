name: Check Copilot recipe PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main]

permissions:
  contents: read

jobs:
  recipe-add-only:
    if: >-
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Verify new recipes and no other file changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Fetch the commit for comparison only; never check out or execute PR content.
          git fetch --no-tags origin "$HEAD_SHA"
          diff_file=$(mktemp)
          trap 'rm -f "$diff_file"' EXIT
          git diff --raw --no-abbrev --no-renames -z "$BASE_SHA...$HEAD_SHA" -- > "$diff_file"
          mapfile -d '' -t changes < "$diff_file"
          added_file='^:000000 100644 [0-9a-f]+ [0-9a-f]+ A$'
          recipe_path='^recipes/([^/]+)/([^/]+\.md)$'

          if (( ${#changes[@]} == 0 || ${#changes[@]} % 2 != 0 )); then
            echo "::error::Copilot must add at least one recipe Markdown file."
            exit 1
          fi
          for ((i = 0; i < ${#changes[@]}; i += 2)); do
            if [[ ! ${changes[i]} =~ $added_file || ! ${changes[i+1]} =~ $recipe_path ]]; then
              echo "::error::Copilot may only add regular .md files directly inside existing recipe categories."
              exit 1
            fi
            category=${BASH_REMATCH[1]}
            filename=${BASH_REMATCH[2]}
            if [[ $category == .* || $filename == .* || $(git cat-file -t "$BASE_SHA:recipes/$category" 2>/dev/null) != tree ]]; then
              echo "::error::The recipe category must be a non-hidden folder present in the base branch."
              exit 1
            fi
          done
