name: Add recipes
description: Submit new recipes for the cookbook.
title: "[Recipe] "
body:
  - type: input
    id: recipe-name
    attributes:
      label: Recipe name(s)
    validations:
      required: true
  - type: textarea
    id: directions
    attributes:
      label: Directions
      description: For each recipe, include ingredients, measurements, and steps in order, or provide a public recipe link.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: "Optional: yield, variations, or attribution."
